name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VideoDownloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: VideoDownloader.apk
      # Stable link for phones: /releases/latest/download/VideoDownloader.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Video Downloader v1.0.${{ github.run_number }}
          files: VideoDownloader.apk
          make_latest: true
